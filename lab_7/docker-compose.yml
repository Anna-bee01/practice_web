version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8006:8000"
    environment:
      - DATABASE_URL=postgresql://user:secret@db:5432/mydb
      - SECRET_KEY=supersecretkey
    depends_on:
      db:
        condition: service_healthy # <--- ВОТ ЭТА МАГИЯ

volumes:
  pgdata: